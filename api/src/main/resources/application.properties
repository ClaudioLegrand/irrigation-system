spring.application.name=irrigation-system

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/irrigation_system_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

hardware.device.ip=192.168.1.100

# === CONFIGURATION OF JOBRUNR ===
org.jobrunr.database.skip-create=false
org.jobrunr.background-job-server.enabled=true
org.jobrunr.dashboard.enabled=true
org.jobrunr.database.table-prefix=jobrunr_

jobrunr.background-job-server.enabled=true
jobrunr.dashboard.enabled=true

# (Opcional) Si el puerto 8000 no te anda, podés cambiarlo al 9000 así:
# jobrunr.dashboard.port=9000
